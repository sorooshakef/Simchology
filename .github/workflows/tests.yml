name: tests

on:
  push:
  pull_request:

jobs:
  core:
    # The core library must work on every OS without any optional extras.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - run: python -m pytest -q

  extras:
    # All optional extras on CPU (CPU-only torch wheels keep the job small).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[all,test]"
      - run: python -m pytest -q -m "not network and not gpu and not ollama and not systemone"
      - run: python scripts/verify_end_to_end.py --level core
